version: '3.8'

services:
  # FastAPI приложение
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/fastapi_db
      - SECRET_KEY=your-secret-key-here
      - PRIVATE_KEY_PATH=certs/jwt-private.pem
      - PUBLIC_KEY_PATH=certs/jwt-public.pem
    depends_on:
      - db
    volumes:
      - ./app:/app
    command: >
      sh -c "python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - fastapi-network

  # PostgreSQL база данных
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=fastapi_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fastapi-network

  # PgAdmin (опционально)
  # pgadmin:
  #   image: dpage/pgadmin4
  #   environment:
  #     - PGADMIN_DEFAULT_EMAIL=admin@admin.com
  #     - PGADMIN_DEFAULT_PASSWORD=admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - db
  #   networks:
  #     - fastapi-network

volumes:
  postgres_data:

networks:
  fastapi-network:
    driver: bridge